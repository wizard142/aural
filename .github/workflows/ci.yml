name: Desktop checks
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: both
        options: [both, linux, windows]
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platform == 'linux' && '["ubuntu-latest"]' || github.event.inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          if ! python -c 'from PySide6.QtWebEngineWidgets import QWebEngineView' || ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update
            sudo apt-get install -y ffmpeg libegl1 libopengl0 libnss3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libasound2t64
          fi
      - name: Prepare Windows runtime tools
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/windows/prepare_tools.py
      - name: Backend and platform tests
        run: python -m unittest discover -s tests -v
      - name: Desktop interaction and audio tests
        run: python desktop.py --self-test --self-test-result smoke-result.json
      - name: Capture Windows dependency notices
        if: runner.os == 'Windows'
        run: python -m piplicenses --with-license-file --format=json --output-file=vendor/notices/python-licenses.json
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean packaging/windows/Aural.spec
      - name: Test the packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Process = Start-Process -FilePath '.\dist\Aural\Aural.exe' -ArgumentList '--self-test','--self-test-result',"`"$PWD\smoke-result-packaged.json`"" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Packaged desktop test failed: $($Process.ExitCode)" }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $Compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          & $Compiler packaging/windows/Aural.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Test Windows installation and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test_installer.ps1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            smoke-result*.json
            smoke-result*.png
          if-no-files-found: warn
      - name: Upload tested Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Aural-Windows-x64
          path: dist/Aural/
      - name: Upload tested Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Aural-Windows-x64-Installer
          path: dist/Aural-Windows-x64-Installer.exe
